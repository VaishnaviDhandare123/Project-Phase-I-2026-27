version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: speechsense_backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - MONGODB_URI=mongodb://mongo:27017
      - DATABASE_NAME=speechsense_db
      - DEFAULT_WHISPER_MODEL=openai/whisper-tiny
    volumes:
      - ./backend/storage:/app/backend/storage
      - ./experiments:/app/experiments
    depends_on:
      - mongo
    restart: unless-stopped

  mongo:
    image: mongo:6.0
    container_name: speechsense_mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

volumes:
  mongo_data:
